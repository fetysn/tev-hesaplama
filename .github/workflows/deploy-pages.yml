name: GitHub Pages'e Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: GitHub Pages'i hazırla
        uses: actions/configure-pages@v5

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Statik siteyi oluştur
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"

      - name: Yayın paketini yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
